name: ctf-submit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ctf-leaderboard      # serialize runs so solvers.json never races
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.event.issue.title, 'ctf:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify submission
        id: verify
        env:                                   # untrusted input goes via env, never inline in run:
          TITLE: ${{ github.event.issue.title }}
          SOLVER: ${{ github.event.issue.user.login }}
          FLAG: ${{ secrets.CTF_FLAG }}
        run: python3 .github/scripts/ctf.py

      - name: Commit leaderboard
        if: steps.verify.outputs.result == 'correct'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/ctf/solvers.json
          git commit -m "ctf: new solver"
          git push

      - name: Reply, close, lock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outputs.result }}
          NUM: ${{ github.event.issue.number }}
        run: |
          case "$RESULT" in
            correct) MSG="🏁 Correct! You're on the leaderboard." ;;
            already) MSG="You've already solved this one." ;;
            *)       MSG="❌ Not quite. Token = first 16 hex of sha256('<flag>:<your-username>')." ;;
          esac
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close   "$NUM" --repo "$GITHUB_REPOSITORY"
          gh issue lock    "$NUM" --repo "$GITHUB_REPOSITORY"
